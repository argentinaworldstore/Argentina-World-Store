<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Armá tu combo de Chops | Argentina World Store</title>
<link rel="stylesheet" href="../common-pages.css"><style>
body{background:#f7f5ef;color:#082745}.bulk-wrap{max-width:1400px;margin:0 auto;padding:40px 5% 80px}.bulk-head{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:26px}.bulk-head h1{font-size:clamp(34px,5vw,68px);margin:0}.bulk-summary{position:sticky;top:10px;background:#fff;border:1px solid #ddd;padding:18px;z-index:3;display:flex;gap:24px;align-items:center;justify-content:space-between;box-shadow:0 8px 25px #0001}.bulk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;margin-top:24px}.bulk-card{background:#fff;border:1px solid #ddd;padding:12px}.bulk-card img{width:100%;aspect-ratio:1/1;object-fit:cover}.bulk-card h3{min-height:48px;font-size:18px}.qty{display:flex;align-items:center;justify-content:center;gap:10px}.qty button{width:40px;height:40px;border:1px solid #082745;background:#fff;font-size:22px}.qty input{width:55px;text-align:center;padding:10px;border:1px solid #bbb}#addBulk{border:0;background:#000;color:#fff;padding:15px 28px;border-radius:30px;font-weight:700}#addBulk:disabled{opacity:.45}.notice{color:#8b2b2b;font-weight:700}.back{display:inline-block;margin-bottom:18px;color:#082745}@media(max-width:700px){.bulk-summary{align-items:flex-start;flex-direction:column}}
</style><link rel="icon" type="image/jpeg" href="../assets/logo-argentina-world-store.jpeg"/>
</head><body>
<main class="bulk-wrap"><a class="back" href="../subcategorias/chops.html">← Volver</a><div class="bulk-head"><div><p>Compra mayorista</p><h1>Armá tu combo de Chops</h1><p>Elegí los modelos y cantidades. Compra mínima: <strong>10</strong>. Máxima: <strong>25</strong>.</p></div></div>
<div class="bulk-summary"><div><strong>Total seleccionado: <span id="totalQty">0</span> unidades</strong><br><span id="totalPrice"></span><div class="notice" id="notice">Faltan 10 unidades para completar el mínimo.</div></div><button id="addBulk" disabled>Agregar combo al carrito</button></div><section class="bulk-grid" id="bulkGrid"></section></main>
<script src="../productos.js"></script><script>
const BULK_ID="chops-combo", OPTION_IDS=["chops-1", "chops-2", "chops-3", "chops-4", "chops-5", "chops-6", "chops-7", "chops-8", "chops-9", "chops-10", "chops-11"], MIN=10, MAX=25;
const all=window.PRODUCTOS||[], bulk=all.find(p=>p.id===BULK_ID), options=OPTION_IDS.map(id=>all.find(p=>p.id===id)).filter(Boolean);const quantities={};
const country=(localStorage.getItem('awsCountryCode')||'AR').toUpperCase();const unit=country==='AR'?bulk.basePriceARS:bulk.foreignPriceARS;
function money(v){return new Intl.NumberFormat(country==='AR'?'es-AR':'en-US',{style:'currency',currency:country==='AR'?'ARS':'USD',maximumFractionDigits:country==='AR'?0:2}).format(country==='AR'?v:v/(Number(localStorage.getItem('awsArsPerUsd'))||1400));}
function total(){return Object.values(quantities).reduce((a,b)=>a+b,0)}
function render(){document.getElementById('bulkGrid').innerHTML=options.map(p=>`<article class="bulk-card"><img src="../Fotos/${p.subcategory}/${p.images[0]}" alt="${p.name}"><h3>${p.name}</h3><div class="qty"><button data-id="${p.id}" data-d="-1">−</button><input readonly value="${quantities[p.id]||0}"><button data-id="${p.id}" data-d="1">+</button></div></article>`).join('');document.querySelectorAll('.qty button').forEach(b=>b.onclick=()=>change(b.dataset.id,Number(b.dataset.d)));update();}
function change(id,d){const t=total();if(d>0&&t>=MAX)return;quantities[id]=Math.max(0,(quantities[id]||0)+d);render();}
function update(){const t=total();document.getElementById('totalQty').textContent=t;document.getElementById('totalPrice').textContent='Total: '+money(t*unit);const n=document.getElementById('notice');if(t<MIN)n.textContent='Faltan '+(MIN-t)+' unidades para completar el mínimo.';else if(t>MAX)n.textContent='Superaste el máximo permitido.';else n.textContent='Combo listo para agregar.';document.getElementById('addBulk').disabled=t<MIN||t>MAX;}
document.getElementById('addBulk').onclick=()=>{const t=total();if(t<MIN||t>MAX)return;let cart=[];try{cart=JSON.parse(localStorage.getItem('awsCart')||'[]')}catch{};cart=Array.isArray(cart)?cart:[];const selections=Object.entries(quantities).filter(([,q])=>q>0).map(([id,quantity])=>({id,quantity,name:all.find(p=>p.id===id)?.name||id}));cart.push({id:BULK_ID,quantity:t,selections});localStorage.setItem('awsCart',JSON.stringify(cart));localStorage.setItem('awsCartCount',String(cart.reduce((s,x)=>s+(Number(x.quantity)||1),0)));alert('Combo agregado al carrito');location.href='../carrito.html';};render();
</script><script src="../language-system.js"></script></body></html>
