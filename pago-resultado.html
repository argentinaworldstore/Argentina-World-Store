<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resultado del pago | Argentina World Store</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="common-pages.css"><style>.result-page{min-height:100vh;display:grid;place-items:center;background:#e8f7fd;padding:30px}.result-card{max-width:680px;background:#fff;padding:55px;text-align:center;box-shadow:0 20px 60px #08233f22}.result-card h1{font-family:serif;font-size:48px}.result-card a{display:inline-block;background:#08233f;color:#fff;padding:15px 28px;margin-top:20px}</style><link rel="icon" type="image/jpeg" href="assets/logo-argentina-world-store.jpeg"/>
</head><body><main class="result-page"><section class="result-card"><h1 id="title">Procesando pago…</h1><p id="message">Esperá unos segundos.</p><a href="index.html">Volver a la tienda</a></section></main><script>
(async()=>{const q=new URLSearchParams(location.search),provider=q.get('provider'),result=q.get('result');const title=document.getElementById('title'),message=document.getElementById('message');try{if(provider==='paypal'&&result==='success'){const token=q.get('token');const r=await fetch('/api/paypal/capture/'+encodeURIComponent(token),{method:'POST'});const d=await r.json();if(!r.ok)throw new Error(d.error||'No se pudo confirmar el pago.');localStorage.removeItem('awsCart');localStorage.setItem('awsCartCount','0');title.textContent='¡Pago confirmado!';message.textContent='Tu compra mediante PayPal fue aprobada.';return}if(provider==='mercadopago'&&result==='success'){localStorage.removeItem('awsCart');localStorage.setItem('awsCartCount','0');title.textContent='¡Pago recibido!';message.textContent='Mercado Pago informó que la compra fue aprobada.';return}if(result==='pending'){title.textContent='Pago pendiente';message.textContent='Te avisaremos cuando el pago sea confirmado.';return}title.textContent=result==='cancelled'?'Pago cancelado':'No se completó el pago';message.textContent='Podés volver al carrito e intentarlo nuevamente.'}catch(e){title.textContent='No pudimos confirmar el pago';message.textContent=e.message}})();
</script><script src="universal-fixes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-auth.js"></script>
</body></html>
